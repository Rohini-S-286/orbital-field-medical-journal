<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Orbital Field Medical Journal — Verification & Clinical Test Suite</title>
  <link rel="stylesheet" href="./styles.css">
  <style>
    body {
      background-color: var(--color-bg);
      color: var(--color-ink);
      font-family: var(--font-sans);
      margin: 0;
      padding: 24px;
      line-height: 1.5;
    }
    .test-header {
      max-width: 1080px;
      margin: 0 auto 24px auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
      border-bottom: 1px solid var(--color-border);
      padding-bottom: 20px;
    }
    .test-header-left h1 {
      font-family: var(--font-serif);
      font-size: 1.8rem;
      color: var(--color-ink);
      margin: 0 0 4px 0;
    }
    .test-container {
      max-width: 1080px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    .metrics-bar {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 16px;
      margin-bottom: 8px;
    }
    .metric-card {
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      padding: 16px;
      box-shadow: var(--shadow-sm);
    }
    .metric-card-label {
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--color-ink-muted);
      margin-bottom: 4px;
    }
    .metric-card-val {
      font-size: 1.8rem;
      font-weight: 700;
      font-family: var(--font-sans);
    }
    .group-card {
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      overflow: hidden;
      box-shadow: var(--shadow-sm);
    }
    .group-header {
      background: var(--color-surface-hover);
      padding: 12px 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--color-border);
    }
    .group-title {
      font-weight: 600;
      font-size: 1rem;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .test-item {
      padding: 12px 18px;
      border-bottom: 1px solid var(--color-border);
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 16px;
    }
    .test-item:last-child {
      border-bottom: none;
    }
    .test-info {
      flex: 1;
    }
    .test-name {
      font-weight: 600;
      font-size: 0.9rem;
      color: var(--color-ink);
    }
    .test-detail {
      font-size: 0.8rem;
      color: var(--color-ink-muted);
      margin-top: 2px;
      font-family: monospace;
    }
    .test-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 0.75rem;
      font-weight: 700;
      padding: 3px 10px;
      border-radius: var(--radius-full);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .test-badge--pass {
      background: var(--color-emerald-tint);
      color: var(--color-emerald);
      border: 1px solid var(--color-emerald-border);
    }
    .test-badge--fail {
      background: var(--color-vermillion-tint);
      color: var(--color-vermillion-text);
      border: 1px solid var(--color-vermillion);
    }
    .controls-row {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
    }
  </style>
</head>
<body>
  <div class="test-header">
    <div class="test-header-left">
      <h1>NASA Clinical & Technical Verification Suite</h1>
      <div class="text-faint" style="font-size: 0.85rem;">
        Orbital Field Medical Journal • Space Apps Challenge Automated Verification Engine
      </div>
    </div>
    <div class="controls-row">
      <button class="btn-primary" id="run-all-tests-btn" style="min-height: 40px;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="5 3 19 12 5 21 5 3"/>
        </svg>
        <span>Re-Run Full Test Suite</span>
      </button>
      <button class="btn-secondary" id="export-report-btn" style="min-height: 40px;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
          <polyline points="7 10 12 15 17 10"/>
          <line x1="12" y1="15" x2="12" y2="3"/>
        </svg>
        <span>Export Test JSON</span>
      </button>
      <a href="./index.html" class="btn-secondary" style="min-height: 40px; text-decoration: none;">
        <span>Return to Journal</span>
      </a>
    </div>
  </div>

  <main class="test-container">
    <div class="metrics-bar">
      <div class="metric-card">
        <div class="metric-card-label">Total Assertions</div>
        <div class="metric-card-val num-tabular" id="total-assertions-val">0</div>
      </div>
      <div class="metric-card">
        <div class="metric-card-label">Passed</div>
        <div class="metric-card-val num-tabular" style="color: var(--color-emerald);" id="passed-assertions-val">0</div>
      </div>
      <div class="metric-card">
        <div class="metric-card-label">Failed</div>
        <div class="metric-card-val num-tabular" style="color: var(--color-vermillion-text);" id="failed-assertions-val">0</div>
      </div>
      <div class="metric-card">
        <div class="metric-card-label">Test Duration</div>
        <div class="metric-card-val num-tabular" id="duration-val">0 ms</div>
      </div>
    </div>

    <div id="test-groups-container">
      <div class="text-faint" style="padding: 24px; text-align: center;">Executing automated clinical test harness...</div>
    </div>
  </main>

  <!-- Load dependencies in standalone mode -->
  <script src="./clinical-ranges.js"></script>
  <script>
    // Embedded Standalone Test Runner & Verification Harness
    (async function() {
      const startTime = performance.now();
      const testReport = [];
      let totalPassed = 0;
      let totalFailed = 0;

      function group(title) {
        const grp = { title, tests: [] };
        testReport.push(grp);
        return {
          assert(name, condition, details = '') {
            const passed = Boolean(condition);
            if (passed) totalPassed++; else totalFailed++;
            grp.tests.push({ name, passed, details });
          }
        };
      }

      // ================= GROUP 1: CLINICAL INDICATORS & STATUS ENGINE =================
      const g1 = group('1. Clinical Status Engine & Reference Boundaries');
      const indicators = window.CLINICAL_INDICATORS || {};

      g1.assert('All 14 clinical indicators exist in dictionary', Object.keys(indicators).length >= 14, `Count: ${Object.keys(indicators).length}`);
      
      // Test classifyIndicator
      if (typeof classifyIndicator === 'function') {
        const sysInNominal = classifyIndicator('systolic', 115);
        g1.assert('Systolic 115 mmHg classifies as in-range', sysInNominal.status === 'in-range', `Got: ${sysInNominal.status}`);
        
        const sysOchre = classifyIndicator('systolic', 135);
        g1.assert('Systolic 135 mmHg classifies as attention (watch)', sysOchre.status === 'attention', `Got: ${sysOchre.status}`);
        
        const sysSurgeon = classifyIndicator('systolic', 148);
        g1.assert('Systolic 148 mmHg escalates to flight-surgeon', sysSurgeon.status === 'flight-surgeon', `Got: ${sysSurgeon.status}`);

        const sysEmergency = classifyIndicator('systolic', 185);
        g1.assert('Systolic 185 mmHg escalates to emergency', sysEmergency.status === 'emergency', `Got: ${sysEmergency.status}`);

        const discNormal = classifyIndicator('opticDisc', 295);
        g1.assert('Optic disc thickness 295 µm classifies as in-range', discNormal.status === 'in-range');

        const discShift = classifyIndicator('opticDisc', 312);
        g1.assert('Optic disc thickness 312 µm classifies as attention (SANS Watch)', discShift.status === 'attention');

        const discHigh = classifyIndicator('opticDisc', 332);
        g1.assert('Optic disc thickness 332 µm classifies as flight-surgeon', discHigh.status === 'flight-surgeon');
      } else {
        g1.assert('classifyIndicator function is defined', false, 'Function missing in clinical-ranges.js');
      }

      // ================= GROUP 2: MISSION READINESS FORMULA & CLINICAL CAPS =================
      const g2 = group('2. Readiness Score Engine & Operational Safety Caps');

      function calculateTestReadiness(systems) {
        const weights = { 'in-range': 100, 'attention': 70, 'flight-surgeon': 35, 'emergency': 10 };
        const anyEmergency = systems.some(s => s.status === 'emergency');
        const anySurgeon = systems.some(s => s.status === 'flight-surgeon');
        const total = systems.reduce((acc, sys) => acc + (weights[sys.status] || 100), 0);
        let score = Math.round(total / systems.length);
        if (anyEmergency) score = Math.min(score, 35);
        else if (anySurgeon) score = Math.min(score, 74);
        return score;
      }

      const allNominal = Array(10).fill({ status: 'in-range' });
      g2.assert('Readiness with 10 nominal systems evaluates to 100%', calculateTestReadiness(allNominal) === 100);

      const oneAttention = [...Array(9).fill({ status: 'in-range' }), { status: 'attention' }];
      const oneAttScore = calculateTestReadiness(oneAttention);
      g2.assert('Readiness with 1 attention system evaluates to 97%', oneAttScore === 97, `Got: ${oneAttScore}%`);

      const withSurgeon = [...Array(9).fill({ status: 'in-range' }), { status: 'flight-surgeon' }];
      const surgeonScore = calculateTestReadiness(withSurgeon);
      g2.assert('Flight surgeon status strictly caps readiness to <= 74%', surgeonScore <= 74, `Got: ${surgeonScore}%`);

      const withEmergency = [...Array(9).fill({ status: 'in-range' }), { status: 'emergency' }];
      const emergScore = calculateTestReadiness(withEmergency);
      g2.assert('Emergency status strictly caps readiness to <= 35%', emergScore <= 35, `Got: ${emergScore}%`);

      // 95% Confidence Interval uncertainty band
      const se = 2.4;
      const margin = Math.round(1.96 * se);
      const ciMin = Math.max(0, 87 - margin);
      const ciMax = Math.min(100, 87 + margin);
      g2.assert('Uncertainty band calculates correct 95% CI around baseline (82%–92%)', ciMin === 82 && ciMax === 92, `Calculated: ${ciMin}–${ciMax}%`);

      // ================= GROUP 3: PHYSIOLOGICAL LIMITS & IMPOSSIBLE VALUES =================
      const g3 = group('3. Telemetry Validation & Impossible Sensor Filtering');
      if (typeof validateVitalInputs === 'function') {
        const validReading = validateVitalInputs({ sysBP: 120, diaBP: 80, hr: 70, spo2: 98 });
        g3.assert('Nominal vital set validates as valid', validReading.valid === true);

        const impossibleSys = validateVitalInputs({ sysBP: 320, diaBP: 80, hr: 70, spo2: 98 });
        g3.assert('Impossible systolic BP (320 mmHg) is rejected', impossibleSys.valid === false);

        const invertedBP = validateVitalInputs({ sysBP: 70, diaBP: 90, hr: 70, spo2: 98 });
        g3.assert('Diastolic exceeding systolic BP is rejected', invertedBP.valid === false);

        const extremeBradycardia = validateVitalInputs({ sysBP: 120, diaBP: 80, hr: 20, spo2: 98 });
        g3.assert('Impossible resting heart rate (20 bpm) is rejected', extremeBradycardia.valid === false);

        const impossibleSpO2 = validateVitalInputs({ sysBP: 120, diaBP: 80, hr: 70, spo2: 105 });
        g3.assert('SpO2 > 100% is rejected', impossibleSpO2.valid === false);
      } else {
        g3.assert('validateVitalInputs is defined', false, 'Missing validation function');
      }

      // ================= GROUP 4: EWMA & CUSUM LONGITUDINAL DRIFT =================
      const g4 = group('4. EWMA & CUSUM Drift Analytics Engine');

      function testDetectDrift(trendData, baseline, sd = 1.0) {
        if (!trendData || trendData.length < 3) return { hasDrift: false };
        const obs = trendData.map(d => d.observed);
        const alpha = 0.3;
        let ewma = obs[0];
        for (let i = 1; i < obs.length; i++) ewma = alpha * obs[i] + (1 - alpha) * ewma;
        const ewmaShift = ewma - baseline;
        const zScore = Math.abs(ewmaShift) / (sd || 1.0);
        const k = 0.5 * sd;
        const h = 3.5 * sd;
        let sPos = 0, sNeg = 0;
        for (let i = 0; i < obs.length; i++) {
          sPos = Math.max(0, sPos + (obs[i] - baseline) - k);
          sNeg = Math.max(0, sNeg - (obs[i] - baseline) - k);
        }
        const hasDrift = zScore >= 2.0 || sPos > h || sNeg > h;
        const direction = (ewmaShift > 0 || sPos > h) ? 'up' : 'down';
        return { hasDrift, direction, delta: Math.round(ewmaShift * 10) / 10, zScore };
      }

      const stableTrend = [
        { observed: 298 }, { observed: 299 }, { observed: 297 }, 
        { observed: 298 }, { observed: 298 }, { observed: 299 }, { observed: 298 }
      ];
      const stableResult = testDetectDrift(stableTrend, 298, 5.0);
      g4.assert('Stable longitudinal telemetry shows no drift', stableResult.hasDrift === false);

      const upwardTrend = [
        { observed: 298 }, { observed: 302 }, { observed: 306 }, 
        { observed: 310 }, { observed: 315 }, { observed: 322 }, { observed: 328 }
      ];
      const upwardResult = testDetectDrift(upwardTrend, 298, 5.0);
      g4.assert('Sustained upward SANS trajectory triggers drift alarm', upwardResult.hasDrift === true);
      g4.assert('Upward drift correctly identifies direction as up', upwardResult.direction === 'up');

      // ================= GROUP 5: NASA 5 HAZARDS LENS MAPPING =================
      const g5 = group('5. NASA 5 Hazards Lens (RIDGE) Architectural Mapping');
      const HAZARD_MAP = {
        all: ['ocular', 'cardio', 'cranial', 'spine', 'pulmonary', 'limbs', 'neuro', 'sleep', 'immune', 'metabolic'],
        radiation: ['immune', 'metabolic'],
        isolation: ['neuro', 'sleep'],
        distance: ['cardio', 'ocular', 'neuro'],
        gravity: ['ocular', 'cardio', 'cranial', 'spine', 'limbs'],
        environment: ['pulmonary', 'metabolic']
      };

      g5.assert('All 5 NASA hazards (R, I, D, G, E) mapped', ['radiation', 'isolation', 'distance', 'gravity', 'environment'].every(k => HAZARD_MAP[k] !== undefined));
      g5.assert('Radiation hazard maps directly to immune & metabolic', HAZARD_MAP.radiation.includes('immune') && HAZARD_MAP.radiation.includes('metabolic'));
      g5.assert('Isolation hazard maps directly to neuro & sleep', HAZARD_MAP.isolation.includes('neuro') && HAZARD_MAP.isolation.includes('sleep'));
      g5.assert('Gravity hazard encompasses cephalad fluid shift & musculoskeletal systems', HAZARD_MAP.gravity.includes('ocular') && HAZARD_MAP.gravity.includes('cardio') && HAZARD_MAP.gravity.includes('limbs'));

      // ================= GROUP 6: OPERATIONAL ENVIRONMENT SELECTOR =================
      const g6 = group('6. Mission Operational Environment & Latency');
      const ENV_PROFILES = {
        iss: { latency: '0.5s', gravity: '0.00g' },
        lunar: { latency: '1.3s', gravity: '0.16g' },
        mars: { latency: '12 min', gravity: '0.38g' },
        rover: { latency: '1.0s', gravity: '0.16g–0.38g' }
      };

      g6.assert('ISS environment sets 0.5s telemetry latency', ENV_PROFILES.iss.latency === '0.5s');
      g6.assert('Lunar Gateway sets 1.3s speed-of-light delay', ENV_PROFILES.lunar.latency === '1.3s');
      g6.assert('Mars Transit sets 12-minute autonomous operational delay', ENV_PROFILES.mars.latency === '12 min');

      // ================= GROUP 7: PSYCHOMOTOR VIGILANCE TASK (PVT) LOGIC =================
      const g7 = group('7. Psychomotor Vigilance Task (PVT) Computational Engine');
      
      const trials = [210, 222, 216];
      const mean = Math.round(trials.reduce((a,b)=>a+b,0) / trials.length);
      g7.assert('Mean reaction latency calculates accurately (216 ms)', mean === 216);

      const hasLapse = [210, 520, 216].some(t => t > 500);
      g7.assert('Lapses (>500 ms) flagged as operational attention debt', hasLapse === true);

      const falseStartPenalty = (120 < 150);
      g7.assert('Premature responses (<150 ms) flagged as false starts', falseStartPenalty === true);

      // ================= GROUP 8: STRICT NON-PHARMACOLOGIC CLINICAL SAFETY AUDIT =================
      const g8 = group('8. Clinical Safety & Non-Pharmacologic Guidance Audit');

      // Fetch and inspect guidance text
      try {
        const srcRes = await fetch('./data/sources.json');
        if (srcRes.ok) {
          const sources = await srcRes.json();
          const srcText = JSON.stringify(sources).toLowerCase();
          
          const forbiddenPhases = [
            'chibis 20 mmhg', 
            '5 degree torso elevation',
            'ibuprofen',
            'acetaminophen',
            'aspirin',
            'mg/kg',
            'milligram',
            'dosage'
          ];

          let cleanAudit = true;
          let violation = '';
          for (const phrase of forbiddenPhases) {
            if (srcText.includes(phrase)) {
              cleanAudit = false;
              violation = phrase;
              break;
            }
          }
          g8.assert('Zero forbidden dosing or unverified protocols in source database', cleanAudit, violation ? `Found: ${violation}` : 'Clean non-pharmacologic protocols');
        } else {
          g8.assert('Sources database verified accessible', false);
        }
      } catch (err) {
        g8.assert('Safety audit completed cleanly', false, err.message);
      }

      // ================= GROUP 9: SAFE STORAGE FALLBACK =================
      const g9 = group('9. In-Memory Resilient Storage Subsystem');
      const mockStorage = {
        _mem: {},
        getItem(k) { return this._mem[k] || null; },
        setItem(k, v) { this._mem[k] = String(v); },
        removeItem(k) { delete this._mem[k]; }
      };

      mockStorage.setItem('test_token', 'offline_mode_active');
      g9.assert('In-memory storage writes keys safely', mockStorage.getItem('test_token') === 'offline_mode_active');
      mockStorage.removeItem('test_token');
      g9.assert('In-memory storage cleans up keys on request', mockStorage.getItem('test_token') === null);

      // ================= RENDER REPORT =================
      const duration = Math.round(performance.now() - startTime);
      document.getElementById('total-assertions-val').textContent = totalPassed + totalFailed;
      document.getElementById('passed-assertions-val').textContent = totalPassed;
      document.getElementById('failed-assertions-val').textContent = totalFailed;
      document.getElementById('duration-val').textContent = `${duration} ms`;

      let html = '';
      testReport.forEach(grp => {
        const grpPassed = grp.tests.filter(t => t.passed).length;
        const grpTotal = grp.tests.length;
        html += `
          <div class="group-card">
            <div class="group-header">
              <div class="group-title">
                <span>${grp.title}</span>
              </div>
              <span class="test-badge ${grpPassed === grpTotal ? 'test-badge--pass' : 'test-badge--fail'}">
                ${grpPassed} / ${grpTotal} PASS
              </span>
            </div>
            <div class="test-list">
        `;
        grp.tests.forEach(t => {
          html += `
            <div class="test-item">
              <div class="test-info">
                <div class="test-name">${t.name}</div>
                ${t.details ? `<div class="test-detail">${t.details}</div>` : ''}
              </div>
              <span class="test-badge ${t.passed ? 'test-badge--pass' : 'test-badge--fail'}">
                ${t.passed ? 'PASS' : 'FAIL'}
              </span>
            </div>
          `;
        });
        html += `
            </div>
          </div>
        `;
      });

      document.getElementById('test-groups-container').innerHTML = html;

      // JSON Export Handler
      document.getElementById('export-report-btn').addEventListener('click', () => {
        const blob = new Blob([JSON.stringify({
          app: 'Orbital Field Medical Journal',
          suite: 'NASA Challenge Verification Engine',
          timestamp: new Date().toISOString(),
          passed: totalPassed,
          failed: totalFailed,
          total: totalPassed + totalFailed,
          durationMs: duration,
          results: testReport
        }, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `ofmj-clinical-verification-${Date.now()}.json`;
        a.click();
        URL.revokeObjectURL(url);
      });

      document.getElementById('run-all-tests-btn').addEventListener('click', () => {
        window.location.reload();
      });

    })();
  </script>
</body>
</html>
